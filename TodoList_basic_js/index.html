<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pastel Todo App</title>
</head>
<body>
    <h1 class="main-title">Welcome to Your Todo List</h1>
   
    <div class="outer">
        <div class="inputArea">
            <input 
                type="text" 
                name="List" 
                id="listName"
                class="listName"
                placeholder="Todo Name"
            >
            <input 
                type="date" 
                name="dateArea" 
                id="dateArea"
                class="dateArea"
            >
            <button id="addBtn" class="addBtn">Add</button>
        </div>

        <h2 class="list_title">Your Tasks</h2>

        <div class="todoListArea">
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
